services:
  app:
    image: weekly-notes:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DEV_AUTH_BYPASS: "false"
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /app/data/zhoubao.sqlite
      BACKUP_DIR: /app/backups
      UPLOAD_DIR: /app/data/uploads
      HOLIDAY_DATA_DIR: /app/resources/holidays
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./runtime/data:/app/data
      - ./runtime/backups:/app/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
